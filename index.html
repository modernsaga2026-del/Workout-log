<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Log</title>
    
    <!-- Libraries to make React and Charts work in the browser -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        /* Your Design Tokens and CSS */
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --lime: #C8FF00; --cyan: #00F5FF; --orange: #FF6B35; }
        body { background: #05020f; color: #fff; font-family: 'Syne', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

        .card-3d {
          background: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
          backdrop-filter: blur(24px) saturate(1.4);
          border: 1px solid rgba(255,255,255,0.08);
          border-radius: 20px;
          padding: 40px;
          box-shadow: 0 20px 60px rgba(0,0,0,0.6);
          text-align: center;
          max-width: 500px;
          margin: 100px auto;
        }

        .btn-primary {
          background: linear-gradient(135deg, #C8FF00, #8ab000);
          color: #000; border: none; border-radius: 12px;
          padding: 12px 24px; font-weight: 800; cursor: pointer;
          margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer } = window.Recharts;

        const T = {
          lime: "#C8FF00",
          bg: "#05020f",
          text: "#ffffff",
        };

        function App() {
            return (
                <div className="card-3d">
                    <h1 style={{ color: T.lime, fontSize: '2.5rem', marginBottom: '10px' }}>WORKOUT LOG</h1>
                    <p style={{ opacity: 0.6, marginBottom: '30px' }}>SYSTEM ONLINE // READY TO TRAIN</p>
                    
                    <div style={{ height: '200px', width: '100%', marginBottom: '20px' }}>
                        {/* Simple placeholder chart to prove Recharts is working */}
                        <ResponsiveContainer>
                            <LineChart data={[{d:1, v:10}, {d:2, v:25}, {d:3, v:15}, {d:4, v:40}]}>
                                <Line type="monotone" dataKey="v" stroke={T.lime} strokeWidth={3} dot={false} />
                            </LineChart>
                        </ResponsiveContainer>
                    </div>

                    <button className="btn-primary">Start New Session</button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
